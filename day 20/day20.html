<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="fetch-task-btn">Fetch Task</button>
    <div id="output"></div>

    <script>
        // 2. Define Promise Function
        function delayLog() {
            return new Promise((resolve) => {
                setTimeout(() => {
                    console.log("Promise resolved after 1 second.");
                    resolve();
                }, 1000);
            });
        }

        // 9. Button Integration: Wrap logic
        function getTodoTask() {
            const outputDiv = document.getElementById("output");
            outputDiv.textContent = "Load";

            // 3. Call .then() on delayLog
            delayLog().then(() => {
                // 4. Basic Fetch
                fetch('https://jsonplaceholder.typicode.com/todos/2')
                    // 5. Chain 1 (Response Check)
                    .then(response => {
                        console.log("Status:", response.status);
                        return response.json();
                    })
                    // 6. & 8. Chain 2 (Data Access) and Display Data
                    .then(data => {
                        console.log(data.title);
                        outputDiv.textContent = data.title;
                    })
                    // 7. Error Handling
                    .catch(error => {
                        console.error("An error occurred.", error);
                        outputDiv.textContent = "Error loading task.";
                    });
            });

            // 10. JSON Stringify
            const testObj = { id: 5, value: 'test' };
            console.log(JSON.stringify(testObj));
        }

        document.getElementById("fetch-task-btn").addEventListener("click", getTodoTask);
    </script>
    </script>
</body>
</html>
