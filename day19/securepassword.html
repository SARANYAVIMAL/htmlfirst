<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
  function isPasswordStrong(password) {
  // Requirement 1: Minimum length of 8 characters
  if (password.length < 8) {
    return false;
  }

  // Requirement 2: Contains at least one uppercase letter
  const hasUppercase = /[A-Z]/.test(password);
  if (!hasUppercase) {
    return false;
  }

  // Requirement 3: Contains at least one digit
  const hasDigit = /\d/.test(password);
  if (!hasDigit) {
    return false;
  }

  // If all conditions are met
  return true;
}

// --- Test Cases ---

const strongPassword = "Password123";
const weakPassword = "short";
const noDigitPassword = "NoDigitsHere";
const noUppercasePassword = "nolowers123";

console.log(`Testing strong password "${strongPassword}": ${isPasswordStrong(strongPassword)}`); // Expected: true
console.log(`Testing weak password "${weakPassword}": ${isPasswordStrong(weakPassword)}`);     // Expected: false
console.log(`Testing password "${noDigitPassword}": ${isPasswordStrong(noDigitPassword)}`);     // Expected: false
console.log(`Testing password "${noUppercasePassword}": ${isPasswordStrong(noUppercasePassword)}`); // Expected: false

        
    </script>
</body>
</html>
